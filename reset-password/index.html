<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a84ff"><title>Reset password | ChatByKarnav KNet</title><script src="https://cdn.jsdelivr.net/npm/appwrite@29.2.0"></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 15%,#dceaff,transparent 45%),linear-gradient(135deg,#eef2f9,#e5eaf5);color:#181920}.card{width:min(440px,100%);padding:30px;border:1px solid #fff;border-radius:24px;background:#ffffffb8;box-shadow:0 20px 48px #14203c22;backdrop-filter:blur(24px)}h1{margin:0 0 8px;font-size:25px}p{color:#5c5e6b;font-size:14px}label{display:block;margin:15px 0 6px;color:#5c5e6b;font-size:14px;font-weight:600}input{width:100%;padding:12px 14px;border:1px solid #d5dbea;border-radius:12px;background:#fff;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#0a84ff;color:white;font:700 15px system-ui;cursor:pointer}.msg{min-height:22px;margin-top:12px;color:#5c5e6b;font-size:13px}.back{display:block;margin-top:14px;text-align:center;color:#0a84ff;text-decoration:none;font-size:14px}
</style></head><body><main class="card"><h1>Reset your password</h1><p>Enter your account email to receive a secure reset link. If you opened a reset link, choose a new password below.</p><form id="send-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button type="submit">Send reset link</button></form><form id="reset-form" hidden><label for="new-password">New password</label><input id="new-password" type="password" minlength="8" maxlength="256" autocomplete="new-password" required placeholder="At least 8 characters"><button type="submit">Update password</button></form><div id="msg" class="msg" role="status" aria-live="polite"></div><a class="back" href="/">Back to ChatByKarnav</a></main>
<script>
(()=>{'use strict';const {Client,Account}=Appwrite;const client=new Client().setEndpoint('https://nyc.cloud.appwrite.io/v1').setProject('6af69d7f00178e3e64c2');const account=new Account(client);const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const userId=params.get('userId')||params.get('user_id');const secret=params.get('secret');if(userId&&secret){$('send-form').hidden=true;$('reset-form').hidden=false;$('msg').textContent='Reset link verified. Choose a new password.';} $('send-form').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim();$('msg').textContent='KNet is sending your reset link…';try{await account.createRecovery({email,url:location.origin+'/reset-password/'});$('msg').textContent='If the account exists, a password reset email has been sent.';}catch(err){$('msg').textContent='KNet could not send the reset email. Please try again.';}});$('reset-form').addEventListener('submit',async e=>{e.preventDefault();const password=$('new-password').value;if(password.length<8){$('msg').textContent='Use at least 8 characters.';return;}$('msg').textContent='KNet is updating your password…';try{await account.updateRecovery({userId,secret,password});$('msg').textContent='Password updated. You can now sign in.';$('reset-form').hidden=true;}catch(err){$('msg').textContent='KNet could not verify this reset link. It may be invalid or expired. Request a new one.';}});})();
</script></body></html>
