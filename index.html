<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e8f1ff">
  <meta name="description" content="ChatByKarnav — a simple, live chat with an iMessage-inspired design.">
  <title>ChatByKarnav — Community Chat</title>
  <style>
    :root {
      color-scheme: light;
      --blue: #087eff; --green: #31c759; --text: #172033; --muted: #748198;
      --line: rgba(255,255,255,.62); --glass: rgba(255,255,255,.58);
      --glass-strong: rgba(255,255,255,.76); --bubble: rgba(255,255,255,.72);
      --shadow: 0 32px 90px rgba(49,82,130,.2), 0 4px 18px rgba(49,82,130,.08);
    }
    [data-theme="dark"] {
      color-scheme: dark; --text: #f3f6ff; --muted: #a4aec2;
      --line: rgba(255,255,255,.12); --glass: rgba(23,29,44,.64);
      --glass-strong: rgba(28,35,52,.84); --bubble: rgba(255,255,255,.1);
      --shadow: 0 32px 90px rgba(0,0,0,.42), 0 4px 18px rgba(0,0,0,.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-width: 320px; height: 100vh; height: 100dvh; overflow: hidden;
      display: grid; place-items: center; padding: 22px; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 18% 12%, rgba(255,255,255,.95), transparent 34%),
                  radial-gradient(ellipse at 82% 18%, rgba(166,207,255,.78), transparent 35%),
                  radial-gradient(ellipse at 55% 100%, rgba(199,184,255,.68), transparent 42%),
                  linear-gradient(135deg,#d9eaff,#eff5ff 48%,#e5e4ff);
    }
    [data-theme="dark"] body { background: radial-gradient(ellipse at 18% 12%,#263d61,transparent 35%),radial-gradient(ellipse at 85% 25%,#34305b,transparent 38%),linear-gradient(145deg,#101827,#111321 60%,#19172b); }
    button,input { font: inherit; } button { -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(1120px,100%); height: min(790px,100%); min-height: 420px; display: flex; overflow: hidden;
      border: 1px solid var(--line); border-radius: 30px; background: var(--glass);
      box-shadow: var(--shadow); backdrop-filter: blur(32px) saturate(155%); -webkit-backdrop-filter: blur(32px) saturate(155%);
      animation: arrive .65s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes arrive { from { opacity:0; transform:translateY(12px) scale(.985) } to { opacity:1; transform:none } }
    .sidebar { width: 285px; flex: 0 0 285px; padding: 30px 19px; border-right: 1px solid var(--line); background: rgba(255,255,255,.2); }
    .brand { display:flex; align-items:center; gap:11px; margin:0 0 38px 5px; }
    .brand-icon { width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.55);border-radius:14px;color:#fff;font-size:19px;background:linear-gradient(145deg,#63b7ff,#087eff);box-shadow:0 8px 20px rgba(8,126,255,.27); }
    .brand-name { margin:0;font-size:19px;letter-spacing:-.55px;font-weight:720; }
    .section-label { margin:0 8px 11px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.1em;text-transform:uppercase; }
    .room { display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(255,255,255,.4);border-radius:17px;background:rgba(255,255,255,.36);box-shadow:inset 0 1px rgba(255,255,255,.4); }
    [data-theme="dark"] .room { background:rgba(255,255,255,.06); }
    .room-icon { width:39px;height:39px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#55adff,#087eff);color:white;font-size:19px; }
    .room-name { font-size:14px;font-weight:680; }.room-status { display:flex;align-items:center;gap:6px;margin-top:5px;color:var(--muted);font-size:12px; }
    .online-dot { width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(49,199,89,.13); }
    .sidebar-note { margin:20px 8px;color:var(--muted);font-size:12px;line-height:1.55; }
    .chat { min-width:0;flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.13); }
    .chat-header { min-height:82px;padding:15px 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(255,255,255,.13); }
    .header-person { display:flex;align-items:center;gap:12px; }.avatar { width:43px;height:43px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.52);border-radius:50%;background:linear-gradient(145deg,#b8e3ff,#78adff);color:white;font-size:19px;box-shadow:0 5px 16px rgba(57,128,220,.2); }
    .header-title { margin:0;font-size:15px;font-weight:700; }.header-subtitle { margin-top:4px;color:var(--muted);font-size:12px; }
    .theme-button { width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--text);background:var(--glass);cursor:pointer;font-size:17px;transition:transform .2s,background .2s; }
    .theme-button:hover { transform:rotate(-10deg) scale(1.05);background:var(--glass-strong); }
    .chat-history { flex:1;overflow-y:auto;padding:26px clamp(16px,5vw,58px);display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth; }
    .chat-history::-webkit-scrollbar { width:7px; }.chat-history::-webkit-scrollbar-thumb { border-radius:9px;background:rgba(100,120,150,.22); }
    .empty-state { margin:auto;max-width:260px;color:var(--muted);text-align:center;line-height:1.5;font-size:14px; }.empty-icon { display:block;margin-bottom:10px;font-size:34px; }
    .message-row { width:100%;display:flex;align-items:flex-end;gap:7px; }.message-row.sent { justify-content:flex-end; }.message-row.received { justify-content:flex-start; }
    .bubble { max-width:min(72%,520px);padding:10px 15px;border:1px solid rgba(255,255,255,.42);border-radius:20px;background:var(--bubble);box-shadow:0 4px 14px rgba(37,62,99,.06);font-size:15px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap;backdrop-filter:blur(14px); }
    .sent .bubble { color:#fff;border-color:rgba(255,255,255,.2);background:linear-gradient(145deg,#38a2ff,#087eff);border-bottom-right-radius:6px;box-shadow:0 6px 16px rgba(8,126,255,.18); }
    .received .bubble { color:var(--text);border-bottom-left-radius:6px; }.sender { display:block;margin-bottom:3px;font-size:11px;font-weight:700;opacity:.72; }
    .message-time { margin:0 7px 3px;color:var(--muted);font-size:10px;white-space:nowrap; }
    .input-area { padding:15px 24px 19px;border-top:1px solid var(--line);background:rgba(255,255,255,.16); }
    .input-row { display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto; }
    .message-input { flex:1;min-width:0;height:48px;padding:0 18px;border:1px solid var(--line);border-radius:25px;outline:none;background:var(--glass-strong);color:var(--text);font-size:15px;box-shadow:inset 0 1px rgba(255,255,255,.5),0 4px 15px rgba(37,62,99,.06);transition:border-color .2s,box-shadow .2s; }
    .message-input:focus,.setup-input:focus { border-color:rgba(8,126,255,.55);box-shadow:0 0 0 4px rgba(8,126,255,.12); }
    .send-button { width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:linear-gradient(145deg,#39a5ff,#087eff);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(8,126,255,.23);transition:transform .18s,opacity .18s; }
    .send-button:hover:not(:disabled) { transform:translateY(-2px) scale(1.04); }.send-button:disabled { opacity:.45;cursor:not-allowed; }.notice { min-height:16px;max-width:760px;margin:7px auto 0;color:var(--muted);font-size:11px; }.notice.error,.setup-error { color:#d93025; }
    .setup-screen { position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(41,63,97,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px); }
    .setup-card { width:min(400px,100%);padding:36px;border:1px solid rgba(255,255,255,.7);border-radius:28px;background:var(--glass-strong);box-shadow:0 28px 80px rgba(37,62,99,.25),inset 0 1px rgba(255,255,255,.75);text-align:center;backdrop-filter:blur(35px) saturate(160%);-webkit-backdrop-filter:blur(35px) saturate(160%); }
    .setup-card .brand-icon { width:56px;height:56px;margin:0 auto 18px;border-radius:19px;font-size:24px; }.setup-card h2 { margin:0 0 8px;font-size:23px;letter-spacing:-.5px; }.setup-card p { margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.5; }
    .setup-input { width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:14px;outline:none;background:rgba(255,255,255,.5);color:var(--text);text-align:center;font-size:15px; }.setup-input::placeholder,.message-input::placeholder { color:var(--muted); }
    [data-theme="dark"] .setup-input { background:rgba(255,255,255,.08); }
    .join-button { width:100%;height:48px;margin-top:12px;border:0;border-radius:14px;background:linear-gradient(145deg,#39a5ff,#087eff);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 7px 18px rgba(8,126,255,.22);transition:transform .18s; }.join-button:hover { transform:translateY(-1px); }.setup-error { min-height:17px;margin-top:9px;font-size:12px; }
    [hidden] { display:none !important; }
    @media (max-width:640px) {
      body { display:block;padding:0; }.app { width:100%;height:100%;height:100dvh;min-height:0;border:0;border-radius:0; }
      .sidebar { display:none; }.chat-header { min-height:72px;padding:12px 17px; }.chat-history { padding:20px 14px; }.bubble { max-width:82%; }
      .input-area { padding:11px 14px max(12px,env(safe-area-inset-bottom)); }.setup-card { padding:30px 24px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior:auto !important;animation-duration:.01ms !important;transition-duration:.01ms !important; } }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .app,.setup-card,.bubble { background:var(--glass-strong); } }
  </style>
</head>
<body>
  <div class="setup-screen" id="setup-screen" role="dialog" aria-modal="true" aria-labelledby="setup-title">
    <form class="setup-card" id="setup-form">
      <div class="brand-icon" aria-hidden="true">✉</div>
      <h2 id="setup-title">Welcome to ChatByKarnav</h2>
      <p>Choose a name to join the live chat.</p>
      <label class="section-label" for="username-input">Your name</label>
      <input class="setup-input" id="username-input" type="text" placeholder="e.g. Alex" maxlength="40" autocomplete="nickname" required>
      <button class="join-button" type="submit">Join Chat</button>
      <div class="setup-error" id="setup-error" role="alert"></div>
    </form>
  </div>
  <div class="app">
    <aside class="sidebar" aria-label="Chats">
      <div class="brand"><div class="brand-icon" aria-hidden="true">✉</div><h1 class="brand-name">ChatByKarnav</h1></div>
      <p class="section-label">Messages</p>
      <div class="room"><div class="room-icon" aria-hidden="true">✦</div><div><div class="room-name">Community Chat</div><div class="room-status"><span class="online-dot"></span><span id="connection-status">Connecting…</span></div></div></div>
      <p class="sidebar-note">A friendly public room. Please be kind and avoid sharing personal information.</p>
    </aside>
    <main class="chat">
      <header class="chat-header"><div class="header-person"><div class="avatar" aria-hidden="true">✦</div><div><h2 class="header-title">Community Chat</h2><div class="header-subtitle" id="header-status">Live conversation</div></div></div><button class="theme-button" id="theme-button" type="button" aria-label="Switch to dark mode" title="Toggle appearance">☾</button></header>
      <section class="chat-history" id="chat-stream" aria-label="Messages" aria-live="polite" aria-relevant="additions"><div class="empty-state" id="empty-state"><span class="empty-icon" aria-hidden="true">💬</span>Say hello and start the conversation.</div></section>
      <footer class="input-area"><form class="input-row" id="message-form"><input class="message-input" id="msg-input" type="text" placeholder="iMessage" maxlength="2000" autocomplete="off" aria-label="Write a message" disabled><button class="send-button" id="send-btn" type="submit" aria-label="Send message" disabled>↑</button></form><div class="notice" id="notice" role="status"></div></footer>
    </main>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { addDoc, collection, getFirestore, limit, onSnapshot, orderBy, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyAZs-dZA-Y8ZLjlBIOqhs9wSVeZjZjW_jA",
      authDomain: "imessageclonekarnav.firebaseapp.com",
      projectId: "imessageclonekarnav",
      storageBucket: "imessageclonekarnav.firebasestorage.app",
      messagingSenderId: "136086923449",
      appId: "1:136086923449:web:b13eb6b0296f8e7e54d368",
      measurementId: "G-F3KWN905WE"
    };
    const el = {
      setup: document.getElementById("setup-screen"), setupForm: document.getElementById("setup-form"),
      name: document.getElementById("username-input"), setupError: document.getElementById("setup-error"),
      messageForm: document.getElementById("message-form"), message: document.getElementById("msg-input"),
      send: document.getElementById("send-btn"), stream: document.getElementById("chat-stream"),
      empty: document.getElementById("empty-state"), notice: document.getElementById("notice"),
      status: document.getElementById("connection-status"), headerStatus: document.getElementById("header-status"),
      theme: document.getElementById("theme-button")
    };
    let currentUser = "", db, unsubscribeMessages;
    function showNotice(message, isError = false) { el.notice.textContent = message; el.notice.classList.toggle("error", isError); }
    function describeError(error) {
      if (error?.code === "permission-denied") return "Chat access is blocked. Check the Firestore security rules for global_messages.";
      if (error?.code === "unavailable") return "Chat is temporarily unavailable. Check your connection and try again.";
      return "Could not connect to chat. Please try again later.";
    }
    function renderMessage(data) {
      const row = document.createElement("div"), sent = data.sender === currentUser;
      row.className = `message-row ${sent ? "sent" : "received"}`;
      const bubble = document.createElement("div"); bubble.className = "bubble";
      if (!sent) { const sender = document.createElement("span"); sender.className = "sender"; sender.textContent = typeof data.sender === "string" ? data.sender : "Guest"; bubble.appendChild(sender); }
      const text = document.createElement("span"); text.textContent = typeof data.text === "string" ? data.text : ""; bubble.appendChild(text); row.appendChild(bubble);
      const date = data.timestamp?.toDate?.();
      if (date) { const time = document.createElement("time"); time.className = "message-time"; time.dateTime = date.toISOString(); time.textContent = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(date); row.appendChild(time); }
      el.stream.appendChild(row);
    }
    function listenForMessages() {
      const messagesQuery = query(collection(db, "global_messages"), orderBy("timestamp", "asc"), limit(200));
      unsubscribeMessages = onSnapshot(messagesQuery, (snapshot) => {
        el.stream.replaceChildren(); el.empty.hidden = !snapshot.empty;
        snapshot.forEach((messageDoc) => renderMessage(messageDoc.data()));
        el.stream.scrollTop = el.stream.scrollHeight; el.status.textContent = "Connected";
        el.headerStatus.textContent = "Live conversation"; showNotice(""); el.message.disabled = false; el.send.disabled = false;
      }, (error) => {
        console.error("Chat listener error:", error); el.status.textContent = "Connection issue";
        el.headerStatus.textContent = "Unable to load messages"; showNotice(describeError(error), true);
      });
    }
    el.setupForm.addEventListener("submit", (event) => {
      event.preventDefault(); const name = el.name.value.trim();
      if (!name) { el.setupError.textContent = "Please enter a name to continue."; el.name.focus(); return; }
      currentUser = name.slice(0, 40); el.setup.hidden = true; el.message.focus(); listenForMessages();
    });
    el.messageForm.addEventListener("submit", async (event) => {
      event.preventDefault(); const text = el.message.value.trim();
      if (!text || !currentUser || !db || el.send.disabled) return;
      el.send.disabled = true; showNotice("");
      try {
        await addDoc(collection(db, "global_messages"), { sender: currentUser, text: text.slice(0, 2000), timestamp: serverTimestamp() });
        el.message.value = "";
      } catch (error) { console.error("Message send error:", error); showNotice(describeError(error), true); }
      finally { el.send.disabled = false; el.message.focus(); }
    });
    el.theme.addEventListener("click", () => {
      const isDark = document.documentElement.dataset.theme !== "dark";
      if (isDark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
      el.theme.textContent = isDark ? "☀" : "☾";
      el.theme.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
    });
    try { db = getFirestore(initializeApp(firebaseConfig)); }
    catch (error) {
      console.error("Firebase initialization error:", error); el.status.textContent = "Offline";
      el.headerStatus.textContent = "Chat could not initialize"; showNotice(describeError(error), true);
      el.setupError.textContent = "Chat is temporarily unavailable. Please try again later.";
    }
    window.addEventListener("beforeunload", () => unsubscribeMessages?.());
  </script>
</body>
</html>
