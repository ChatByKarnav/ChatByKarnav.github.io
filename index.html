<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f1ff"><meta name="description" content="ChatByKarnav community chat"><title>ChatByKarnav</title>
<style>
:root{color-scheme:light;--bg:#edf3ff;--panel:#fff;--text:#172033;--muted:#718096;--line:#dce5f2;--blue:#087eff;--bubble:#f1f5fb}*{box-sizing:border-box}body{margin:0;height:100dvh;background:linear-gradient(135deg,#fff,#eaf1ff);color:var(--text);font:15px system-ui;display:grid;place-items:center}body.dark{color-scheme:dark;--panel:#1b2638;--text:#eff4ff;--muted:#a8b4c8;--line:#344258;--bubble:#26344a;background:#101827}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{width:min(1120px,100%);height:min(820px,100dvh);display:grid;grid-template-columns:220px 1fr;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--panel)}.side{padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.brand{font-size:20px;font-weight:800;padding:8px}.nav,.thread{width:100%;text-align:left;border:0;border-radius:10px;padding:11px;background:transparent}.nav:hover,.nav.active,.thread:hover,.thread.selected{background:var(--bubble)}.badge{color:var(--blue);font-weight:800}.account{margin-top:auto;border-top:1px solid var(--line);padding:12px 4px;overflow-wrap:anywhere}.main{display:flex;min-width:0;flex-direction:column}.top{min-height:64px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.top h2{margin:0;font-size:17px}.top small,.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--panel)}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.area{display:none;min-height:0;flex:1}.area.active{display:flex;flex-direction:column}.layout{display:grid;grid-template-columns:210px 1fr;min-height:0;flex:1}.threads{padding:10px;border-right:1px solid var(--line);overflow:auto}.thread{display:block;margin:4px 0;font-size:13px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:16px}.msg{align-self:flex-start;max-width:min(80%,620px);background:var(--bubble);border:1px solid var(--line);border-radius:15px;padding:10px 12px;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#39a5ff,#087eff);color:white;border-color:transparent}.by{font-size:11px;font-weight:750;opacity:.8}.when{font-size:10px;opacity:.72;margin-top:5px}.quote{border-left:2px solid currentColor;padding-left:7px;opacity:.75;margin:4px 0;font-size:12px}.tools{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.tools button{background:transparent;border:0;padding:2px;font-size:12px}.compose{border-top:1px solid var(--line);padding:11px 14px}.row{display:flex;gap:8px}.row input,.field input,.field textarea,.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.row input{flex:1}.hint{min-height:18px;font-size:12px;color:var(--muted);padding:4px 2px}.content{padding:20px;overflow:auto}.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}.card{padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.field{display:grid;gap:5px;margin:12px 0}.field textarea{min-height:78px}.hidden{display:none!important}.subheading{font-size:11px;font-weight:750;color:var(--muted);margin:14px 7px 4px}.avatar{width:38px;height:38px;border-radius:50%;background:#c9dcff;display:grid;place-items:center;font-weight:800}.personhead{display:flex;gap:9px;align-items:center}.thread small{color:var(--blue);font-weight:800}.reactions{font-size:12px;color:var(--blue);margin-top:4px}.online{color:#20a45a}.offline{color:var(--muted)}@media(max-width:700px){body{display:block}.shell{height:100dvh;width:100%;border:0;border-radius:0;grid-template-columns:60px 1fr}.side{padding:10px 4px;align-items:center}.brand{font-size:0}.brand:after{content:'✉';font-size:20px}.nav{font-size:0;text-align:center;padding:11px 2px}.nav:before{content:attr(data-icon);font-size:18px}.nav .badge{font-size:10px;display:block}.ac </style></head><body>
<div class="shell" id="app" hidden><aside class="side"><div class="brand">ChatByKarnav</div><button class="nav active" data-view="chat" data-icon="💬">Community <span class="badge" id="global-badge"></span></button><button class="nav" data-view="people" data-icon="👥">People</button><button class="nav" data-view="profile" data-icon="👤">Profile</button><div class="account"><span id="myname">Signed in</span><br><small id="my-presence" class="online">● Online</small><p><button class="btn" id="theme">🌙</button> <button class="btn" id="signout">Sign out</button></p></div></aside><main class="main"><header class="top"><div><h2 id="title">Community chat</h2><small id="subtitle">Everyone in the community</small></div><button class="btn" id="notify">Enable notifications</button></header>
<section class="area active" id="view-chat"><div class="layout"><aside class="threads"><button class="thread selected" id="global-thread">🌐 Community chat</button><div class="subheading">PRIVATE MESSAGES</div><div id="thread-list"></div></aside><div class="main"><div class="messages" id="messages" aria-live="polite"></div><footer class="compose"><div class="row"><input id="message-input" maxlength="2000" placeholder="Write a message…"><button class="btn primary" id="send">Send</button></div><div class="hint" id="status" aria-live="polite"></div><div class="row"><input id="search-messages" placeholder="Search loaded messages"><button class="btn" id="older" hidden>Load older</button></div></footer></div></div></section>
<section class="area" id="view-people"><div class="content"><h2>Find people</h2><p class="muted">Browse profiles, see online status, message, block, or report members.</p><form class="row" id="search-form"><input class="search" id="search-input" maxlength="40" placeholder="Search by name"><button class="btn primary">Search</button></form><div class="hint" id="search-status"></div><div class="people" id="people-results"></div></div></section>
<section class="area" id="view-profile"><div class="content"><h2>Your profile</h2><form class="card" id="profile-form" style="max-width:620px"><label class="field">Display name<input id="display-name" maxlength="40" required></label><label class="field">Class / grade<input id="grade" maxlength="40"></label><label class="field">Division<input id="division" maxlength="40"></label><label class="field">School<input id="school" maxlength="100"></label><label class="field">Bio<textarea id="bio" maxlength="280"></textarea></label><button class="btn primary">Save profile</button><span class="hint" id="profile-status"></span></form></div></section></main></div>
<div class="content" id="login" style="max-width:430px;margin:10vh auto"><h1>ChatByKarnav</h1><p>Sign in or create an account to join.</p><form id="auth-form"><label class="field">Name (for signup)<input id="auth-name" maxlength="40"></label><label class="field">Email<input id="email" type="email" required></label><label class="field">Password<input id="password" type="password" minlength="6" required></label><div class="row"><button class="btn primary">Sign in</button><button class="btn" id="signup" type="button">Create account</button></div><p class="hint" id="auth-status"></p></form></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut,updateProfile}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,collection,doc,getDoc,setDoc,addDoc,query,where,orderBy,limit,onSnapshot,serverTimestamp,getDocs,startAfter,deleteDoc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const config={apiKey:'AIzaSyAZs-dZA-Y8ZLjlBIOqhs9wSVeZjZjW_jA',authDomain:'imessageclonekarnav.firebaseapp.com',projectId:'imessageclonekarnav',storageBucket:'imessageclonekarnav.firebasestorage.app',messagingSenderId:'136086923449',appId:'1:136086923449:web:b13eb6b0296f8e7e54d368'};const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user=null,profile={},active='global',peer=null,stopMessages=null,stopThreads=null,stopTyping=null,stopPresence=null,cursor=null,reply=null,blocked=new Set(),lastIds=new Set(),presenceTimers=[],sendBusy=false,notifyAt=0;
const msgCol=()=>active==='global'?collection(db,'global_messages'):collection(db,'conversations',active,'messages');function setStatus(s,err=false){$('status').textContent=s;$('status').style.color=err?'#c33':''}function changeView(v){document.querySelectorAll('.area').forEach(x=>x.classList.toggle('active',x.id==='view-'+v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('title').textContent=v==='chat'?(active==='global'?'Community chat':peer?.displayName||'Private chat'):v==='people'?'Find people':'Your profile';$('subtitle').textContent=v==='chat'?(active==='global'?'Everyone in the community':peer?.online?'● Online':'Private conversation'):''}
function cleanupChat(){stopMessages?.();stopTyping?.();stopPresence?.();stopMessages=stopTyping=stopPresence=null}
function notify(data,id){if(data.uid===user.uid||!('Notification'in window)||Notification.permission!=='granted'||Date.now()-notifyAt<900)return;notifyAt=Date.now();try{new Notification(data.sender||'New message',{body:data.text||'New message',tag:id})}catch{}}
async function renderReactions(el,id){const c=collection(msgCol(),id,'reactions');onSnapshot(c,s=>{if(!el.isConnected)return;let counts={};s.forEach(d=>{const e=d.data().emoji;if(e)counts[e]=(counts[e]||0)+1});let box=el.querySelector('.reactions');if(!box){box=document.createElement('div');box.className='reactions';el.append(box)}box.textContent=Object.entries(counts).map(([e,n])=>`${e} ${n}`).join(' · ')})}
function renderMessage(m,id){if(blocked.has(m.uid))return null;const el=document.createElement('article');el.className='msg'+(m.uid===user.uid?' mine':'');el.dataset.id=id;el.dataset.text=(m.text||'').toLocaleLowerCase();if(m.replyTo){const q=document.createElement('div');q.className='quote';q.textContent='↪ '+m.replyTo.sender+': '+m.replyTo.text;el.append(q)}const by=document.createElement('div');by.className='by';by.textContent=m.uid===user.uid?'You':m.sender||'Member';el.append(by);const body=document.createElement('div');body.textContent=m.text||'';el.append(body);const when=document.createElement('div');when.className='when';when.textContent=m.timestamp?.toDate?new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(m.timestamp.toDate()):'';el.append(when);const tools=document.createElement('div');tools.className='tools';for(const emoji of ['👍','❤️','😂']){const b=document.createElement('button');b.type='button';b.textContent=emoji;b.onclick=async()=>{const r=doc(msgCol(),id,'reactions',user.uid),s=await getDoc(r);try{if(s.exists()&&s.data().emoji===emoji)await deleteDoc(r);else await setDoc(r,{uid:user.uid,emoji,createdAt:serverTimestamp()})}catch{setStatus('Reaction failed: check Firestore rules.',true)}};tools.append(b)}const r=document.createElement('button');r.type='button';r.textContent='↩ Reply';r.onclick=()=>{reply={id,text:m.text||'',sender:m.sender||'Member'};$('message-input').placeholder='Replying to '+reply.sender;$('message-input').focus()};tools.append(r);if(m.uid!==user.uid){const b=document.createElement('button');b.type='button';b.textContent='⚑ Report';b.onclick=()=>report(m.uid,id,active==='global'?'global':'private');tools.append(b)}el.append(tools);renderReactions(el,id);return el}
async function loadMessages(initial=true){if(!user)return;const box=$('messages');if(initial){box.replaceChildren();cursor=null}try{const q=initial?query(msgCol(),orderBy('timestamp','desc'),limit(50)):query(msgCol(),orderBy('timestamp','desc'),startAfter(cursor),limit(50)),s=await getDocs(q);if(!s.empty){cursor=s.docs[s.docs.length-1];const list=s.docs.map(d=>({id:d.id,...d.data()})).reverse(),height=box.scrollHeight;for(const m of list){if(box.querySelector(`[data-id="${CSS.escape(m.id)}"]`))continue;const el=renderMessage(m,m.id);if(el)box.append(el);if(initial&&active==='global'&&!lastIds.has(m.id))notify(m,m.id)}$('older').hidden=s.size<50;box.scrollTop=initial?box.scrollHeight:box.scrollHeight-height}else $('older').hidden=true}catch(e){console.error(e);setStatus('Could not load messages. Check rules/indexes.',true)}}
async function markRead(){const path=active==='global'?doc(db,'globalReadReceipts',user.uid):doc(db,'conversations',active,'readReceipts',user.uid);try{await setDoc(path,{readAt:serverTimestamp()},{merge:true});if(active==='global')$('global-badge').textContent=''}catch{}}
function watchChat(){cleanupChat();loadMessages(true);const q=query(msgCol(),orderBy('timestamp','desc'),limit(50));stopMessages=onSnapshot(q,s=>{const near=$('messages').scrollHeight-$('messages').scrollTop-$('messages').clientHeight<140;s.docChanges().filter(c=>c.type==='added').reverse().forEach(c=>{const m={id:c.doc.id,...c.doc.data()};if($('messages').querySelector(`[data-id="${CSS.escape(m.id)}"]`))return;const el=renderMessage(m,m.id);if(el)$('messages').append(el);if(active==='global'&&!lastIds.has(m.id)){lastIds.add(m.id);if(lastIds.size>300)lastIds.delete(lastIds.values().next().value);if(m.uid!==user.uid)notify(m,m.id)}});if(near)$('messages').scrollTop=$('messages').scrollHeight;markRead()},e=>setStatus('Live updates blocked by Firestore rules.',true));const tc=active==='global'?collection(db,'global_typing'):collection(db,'conversations',active,'typing');stopTyping=onSnapshot(tc,s=>{const x=s.docs.find(d=>d.id!==user.uid&&d.data().typing&&Date.now()-(d.data().updatedAt?.toMillis?.()||0)<7000);setStatus(x?(x.data().name||'Member')+' is typing…':'')},()=>{});if(peer){stopPresence=onSnapshot(doc(db,'users',peer.uid,'presence','current'),s=>{peer.online=s.exists()&&s.data().online&&Date.now()-(s.data().lastSeen?.toMillis?.()||0)<120000;$('subtitle').textContent=peer.online?'● Online':'Private conversation'})} }
function openGlobal(){active='global';peer=null;$('global-thread').classList.add('selected');document.querySelectorAll('.thread[data-id]').forEach(x=>x.classList.remove('selected'));changeView('chat');watchChat()}
async function openPrivate(p){try{const members=[user.uid,p.uid].sort(),id=members.join('_'),r=doc(db,'conversations',id),s=await getDoc(r);if(!s.exists())await setDoc(r,{members,createdAt:serverTimestamp(),lastMessage:'',updatedAt:serverTimestamp()});active=id;peer=p;$('global-thread').classList.remove('selected');changeView('chat');watchChat();listenThreads()}catch(e){console.error(e);alert('Could not open private chat. Apply the updated Firestore rules.')}}
function listenThreads(){stopThreads?.();stopThreads=onSnapshot(query(collection(db,'conversations'),where('members','array-contains',user.uid),orderBy('updatedAt','desc'),limit(30)),s=>{const box=$('thread-list');box.replaceChildren();s.forEach(async d=>{const x=d.data(),uid=x.members.find(a=>a!==user.uid),pdoc=await getDoc(doc(db,'publicProfiles',uid)),name=x.memberNames?.[uid]||pdoc.data()?.displayName||'Private chat',read=await getDoc(doc(db,'conversations',d.id,'readReceipts',user.uid)),readAt=read.data()?.readAt,unread=readAt&&x.updatedAt&&x.updatedAt.toMillis()>readAt.toMillis()&&x.lastSender!==user.uid,b=document.createElement('button');b.className='thread'+(d.id===active?' selected':'');b.dataset.id=d.id;b.textContent='🔒 '+name+' · '+(x.lastMessage||'Start chatting').slice(0,20);if(unread){const badge=document.createElement('small');badge.textContent=' • NEW';b.append(badge)}b.onclick=()=>openPrivate({uid,displayName:name});box.append(b)})},e=>console.warn(e))}
async function send(){const input=$('message-input'),text=input.value.trim();if(!text||sendBusy)return;sendBusy=true;$('send').disabled=true;try{const data={uid:user.uid,sender:profile.displayName,text:text.slice(0,2000),timestamp:serverTimestamp()};if(reply)data.replyTo={id:reply.id,text:reply.text.slice(0,300),sender:reply.sender};if(active==='global')await addDoc(collection(db,'global_messages'),data);else{await addDoc(collection(db,'conversations',active,'messages'),data);await setDoc(doc(db,'conversations',active),{lastMessage:text.slice(0,100),lastSender:user.uid,updatedAt:serverTimestamp(),memberNames:{[user.uid]:profile.displayName}},{merge:true})}input.value='';input.placeholder='Write a message…';reply=null;setStatus('');}catch(e){console.error(e);setStatus('Message not sent; check Firestore rules.',true)}finally{sendBusy=false;$('send').disabled=false;input.focus()}}
let typingTimer;async function typing(on){if(!user)return;const col=active==='global'?collection(db,'global_typing'):collection(db,'conversations',active,'typing'),r=doc(col,user.uid);try{if(on)await setDoc(r,{typing:true,name:profile.displayName,updatedAt:serverTimestamp()});else await deleteDoc(r)}catch{}}
async function report(targetUid,messageId,scope){const reason=prompt('Why are you reporting this?');if(!reason)return;try{await addDoc(collection(db,'reports'),{reporterUid:user.uid,targetUid,messageId,scope,reason:reason.slice(0,500),createdAt:serverTimestamp(),status:'open'});setStatus('Report submitted.')}catch{setStatus('Could not submit report.',true)}}async function block(uid,name){if(!confirm('Block '+name+'? Their messages will be hidden for you.'))return;try{await setDoc(doc(db,'users',user.uid,'blocks',uid),{createdAt:serverTimestamp()});blocked.add(uid);document.querySelectorAll('.msg').forEach(x=>{if(x.querySelector('.by')?.textContent===name)x.remove()});setStatus(name+' blocked.')}catch{alert('Could not block member; check Firestore rules.')}}
$('auth-form').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(x){$('auth-status').textContent=x.message}};$('signup').onclick=async()=>{const n=$('auth-name').value.trim();if(!n){$('auth-status').textContent='Enter your name first.';return}try{const c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await updateProfile(c.user,{displayName:n})}catch(x){$('auth-status').textContent=x.message}};
onAuthStateChanged(auth,async u=>{user=u;if(!u){$('login').classList.remove('hidden');$('app').hidden=true;cleanupChat();stopThreads?.();return}try{const p=doc(db,'publicProfiles',u.uid),s=await getDoc(p);profile=s.exists()?s.data():{displayName:u.displayName||'Community member',grade:'',division:'',school:'',bio:''};profile.displayName=profile.displayName||u.displayName||'Community member';if(!s.exists())await setDoc(p,{displayName:profile.displayName,displayNameLower:profile.displayName.toLowerCase(),grade:'',division:'',school:'',bio:'',updatedAt:serverTimestamp()});$('display-name').value=profile.displayName;$('grade').value=profile.grade||'';$('division').value=profile.division||'';$('school').value=profile.school||'';$('bio').value=profile.bio||'';$('myname').textContent=profile.displayName;$('login').classList.add('hidden');$('app').hidden=false;const bs=await getDocs(collection(db,'users',u.uid,'blocks'));blocked=new Set(bs.docs.map(d=>d.id));listenThreads();openGlobal();const pr=doc(db,'users',u.uid,'presence','current'),beat=()=>setDoc(pr,{online:true,lastSeen:serverTimestamp()},{merge:true}).catch(()=>{});beat();const timer=setInterval(beat,60000);presenceTimers.push(timer);window.addEventListener('beforeunload',()=>setDoc(pr,{online:false,lastSeen:serverTimestamp()},{merge:true}));const receipt=await getDoc(doc(db,'globalReadReceipts',u.uid));if(receipt.exists()){const q=query(collection(db,'global_messages'),where('timestamp','>',receipt.data().readAt),limit(50)),unread=await getDocs(q);$('global-badge').textContent=unread.size?` ${unread.size}+`:''}}catch(e){console.error(e);$('auth-status').textContent='Could not load profile or rules.'}});
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>changeView(b.dataset.view));$('global-thread').onclick=openGlobal;$('send').onclick=send;$('message-input').addEventListener('input',()=>{typing(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>typing(false),1500)});$('message-input').addEventListener('blur',()=>typing(false));$('older').onclick=()=>loadMessages(false);$('search-messages').oninput=e=>{const t=e.target.value.toLowerCase();document.querySelectorAll('.msg').forEach(m=>m.hidden=!m.dataset.text.includes(t))};$('theme').onclick=()=>document.body.classList.toggle('dark');$('signout').onclick=()=>signOut(auth);$('notify').onclick=async()=>{if('Notification'in window){const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'Notifications enabled':'Notifications blocked'}};
$('search-form').onsubmit=async e=>{e.preventDefault();const term=$('search-input').value.trim().toLowerCase(),box=$('people-results');box.replaceChildren();$('search-status').textContent='Searching…';if(term.length<2){$('search-status').textContent='Enter at least 2 characters.';return}try{const s=await getDocs(query(collection(db,'publicProfiles'),orderBy('displayNameLower'),limit(100)));let count=0;for(const d of s.docs){if(d.id===user.uid||blocked.has(d.id)||!d.data().displayName?.toLowerCase().includes(term))continue;const p=d.data(),card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='personhead';const av=document.createElement('div');av.className='avatar';av.textContent=(p.displayName||'?')[0].toUpperCase();const title=document.createElement('strong');title.textContent=p.displayName||'Member';const pres=document.createElement('small');pres.className='offline';pres.textContent='● Offline';head.append(av,title,pres);card.append(head);const details=document.createElement('p');details.className='muted';details.textContent=[p.grade&&'Class '+p.grade,p.division&&'Division '+p.division,p.school,p.bio].filter(Boolean).join(' · ');card.append(details);onSnapshot(doc(db,'users',d.id,'presence','current'),ps=>{const online=ps.exists()&&ps.data().online&&Date.now()-(ps.data().lastSeen?.toMillis?.()||0)<120000;pres.className=online?'online':'offline';pres.textContent=online?'● Online':'● Offline'});for(const [label,fn] of [['Message',()=>openPrivate({uid:d.id,...p})],['Block',()=>block(d.id,p.displayName)],['Report',()=>report(d.id,'','profile')]]){const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=fn;card.append(b)}box.append(card);count++}$('search-status').textContent=count?`${count} profile(s) found.`:'No matching profiles.'}catch(x){console.error(x);$('search-status').textContent='Search failed; check rules and indexes.'}};
$('profile-form').onsubmit=async e=>{e.preventDefault();const name=$('display-name').value.trim(),p={displayName:name,displayNameLower:name.toLowerCase(),grade:$('grade').value.trim(),division:$('division').value.trim(),school:$('school').value.trim(),bio:$('bio').value.trim(),updatedAt:serverTimestamp()};try{await setDoc(doc(db,'publicProfiles',user.uid),p,{merge:true});await updateProfile(user,{displayName:name});profile={...profile,...p};$('myname').textContent=name;$('profile-status').textContent='Profile saved.'}catch(x){$('profile-status').textContent='Could not save; check Firestore rules.'}};
</script></body></html>
