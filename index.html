<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live iMessage Web</title>
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-gray: #e9e9eb;
            --ios-dark-gray: #8e8e93;
            --border-color: #e5e5ea;
            --sidebar-bg: #f2f2f7;
            --chat-bg: #ffffff;
            --text-color: #000000;
            --sub-text: #8e8e93;
        }

        [data-theme="dark"] {
            --ios-gray: #262629;
            --border-color: #2c2c2e;
            --sidebar-bg: #1c1c1e;
            --chat-bg: #000000;
            --text-color: #ffffff;
            --sub-text: #aeaeae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f2937, #111827);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .app-container {
            width: 100vw;
            height: 100vh;
            background: var(--chat-bg);
            display: flex;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: background 0.3s;
        }

        @media (min-width: 768px) {
            .app-container {
                width: 95vw;
                height: 90vh;
                border-radius: 14px;
                overflow: hidden;
            }
        }

        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px 16px 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
        }

        .identity-box {
            font-size: 12px;
            background: rgba(0, 122, 255, 0.1);
            color: var(--ios-blue);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .chat-window {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
        }

        .chat-header {
            height: 64px;
            background: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .chat-header-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-color);
        }

        .chat-header-sub {
            font-size: 12px;
            color: var(--sub-text);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg-row {
            display: flex;
            width: 100%;
        }

        .msg-row.sent { justify-content: flex-end; }
        .msg-row.received { justify-content: flex-start; }

        .bubble {
            max-width: 60%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg-row.sent .bubble {
            background-color: var(--ios-blue);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .msg-row.received .bubble {
            background-color: var(--ios-gray);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 16px 24px;
            background: var(--chat-bg);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            flex: 1;
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            position: relative;
        }

        .message-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 15px;
            background: transparent;
            color: var(--text-color);
            padding-right: 32px;
            height: 24px;
        }

        .send-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: var(--ios-blue);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            right: 6px;
            top: 5px;
        }
        
        .setup-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: var(--text-color);
            gap: 16px;
        }
        
        .setup-input {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 260px;
            text-align: center;
            font-size: 16px;
            background: var(--sidebar-bg);
            color: var(--text-color);
        }
        
        .btn-start {
            background: var(--ios-blue);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- USER INITIALIZATION SCREEN -->
    <div class="setup-screen" id="setup-screen">
        <h2>Enter a Username to Connect</h2>
        <input type="text" id="username-input" class="setup-input" placeholder="e.g. Alex or Taylor">
        <button class="btn-start" onclick="initializeLiveChat()">Join Chatroom</button>
    </div>

    <div class="app-container" id="app">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-row">
                    <h1 class="sidebar-title">Global iMessage</h1>
                    Connecting...</span>
                </div>
            </div>
        </aside>

        <!-- MAIN WINDOW -->
        <main class="chat-window">
            <header class="chat-header">
                <div class="chat-header-name">Public Live Channel</div>
                <div class="chat-header-sub">Real-Time Cloud Connected</div>
            </header>

            <div class="chat-history" id="chat-stream">
                <!-- Messages populate here dynamically -->
            </div>

            <footer class="input-area">
                <div class="input-container">
                    <input type="text" class="message-input" id="msg-input" placeholder="iMessage">
                    <button class="send-btn" id="send-btn">↑</button>
                </div>
            </footer>
        </main>
    </div>

    <!-- Firebase SDK Hook Pipeline -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://gstatic.com";

        // Verified Live Project Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyAZs-dZA-Y8ZLjlBIOqhs9wSVeZjZjW_jA",
            authDomain: "imessageclonekarnav.firebaseapp.com",
            projectId: "imessageclonekarnav",
            storageBucket: "imessageclonekarnav.firebasestorage.app",
            messagingSenderId: "136086923449",
            appId: "1:136086923449:web:b13eb6b0296f8e7e54d368",
            measurementId: "G-F3KWN905WE"
        };

        // Initialize App Connection Mapping
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentUser = "";

        // Global application initialization binder
        window.initializeLiveChat = function() {
            const nameInput = document.getElementById('username-input').value.trim();
            if(!nameInput) return alert("Please enter a valid username!");
            
            currentUser = nameInput;
            document.getElementById('my-name-badge').innerText = currentUser;
            document.getElementById('setup-screen').style.display = 'none';

            // Connect WebSocket Listener Stream
            listenForMessages();
        };

        // Push data changes to Firestore
        async function sendLiveMessage() {
            const msgInput = document.getElementById('msg-input');
            const txt = msgInput.value.trim();
            if(!txt) return;

            try {
                await addDoc(collection(db, "global_messages"), {
                    sender: currentUser,
                    text: txt,
timestamp: serverTimestamp()
});
msgInput.value = "";
} catch (e) {
console.error("Firestore database write error: ", e);
}
}
// Keep local client state synced with server nodes
function listenForMessages() {
const chatStream = document.getElementById('chat-stream');
const q = query(collection(db, "global_messages"), orderBy("timestamp", "asc"));
onSnapshot(q, (snapshot) => {
chatStream.innerHTML = ""; // Flush DOM representation
snapshot.forEach((doc) => {
const data = doc.data();
const row = document.createElement('div');
row.classList.add('msg-row');
if(data.sender === currentUser) {
row.classList.add('sent');
} else {
row.classList.add('received');
}
const bubble = document.createElement('div');
bubble.classList.add('bubble');
// Display sender tags for other active computers
bubble.innerText = data.sender === currentUser ? data.text : ${data.sender}: ${data.text};
row.appendChild(bubble);
chatStream.appendChild(row);
});
chatStream.scrollTop = chatStream.scrollHeight; // Drive active auto-scroll
});
}
// Bind interactive event hooks
document.getElementById('send-btn').addEventListener('click', sendLiveMessage);
document.getElementById('msg-input').addEventListener('keydown', (e) => {
if(e.key === 'Enter') sendLiveMessage();
});
