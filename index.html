<html lang="en">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e8f1ff"><meta name="description" content="ChatByKarnav — community chat and private messages."><title>ChatByKarnav</title>

<style>
:root{color-scheme:light;--bg:#edf3ff;--panel:#ffffffd9;--text:#172033;--muted:#718096;--line:#dce5f2;--blue:#087eff;--bubble:#f1f5fb}*{box-sizing:border-box}body{margin:0;height:100dvh;background:radial-gradient(at 15% 10%,#fff,#edf3ff 55%,#e9e9ff);color:var(--text);font:15px system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center}body.dark{color-scheme:dark;--bg:#101827;--panel:#1b2638;--text:#eff4ff;--muted:#a8b4c8;--line:#344258;--bubble:#26344a;background:linear-gradient(135deg,#101827,#1d2540)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{width:min(1120px,100%);height:min(820px,100dvh);display:grid;grid-template-columns:235px 1fr;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:0 24px 80px #24436b25}.side{padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px}.brand{font-size:20px;font-weight:800;padding:8px}.nav,.person,.thread{width:100%;text-align:left;border:0;border-radius:12px;padding:12px;background:transparent}.nav:hover,.nav.active,.thread:hover,.person:hover{background:var(--bubble)}.nav .badge{float:right;color:var(--blue);font-weight:800}.account{margin-top:auto;border-top:1px solid var(--line);padding:14px 5px 0;overflow-wrap:anywhere}.main{display:flex;min-width:0;flex-direction:column}.top{height:67px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.top h2{font-size:17px;margin:0}.top small,.muted{color:var(--muted)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--panel)}.btn.primary{background:var(--blue);color:white;border-color:var(--blue)}.area{display:none;min-height:0;flex:1}.area.active{display:flex;flex-direction:column}.chatlayout{display:grid;grid-template-columns:220px 1fr;min-height:0;flex:1}.threads{padding:12px;border-right:1px solid var(--line);overflow: }@media(max-width:700px){body{display:block}.shell{height:100dvh;width:100%;border:0;border-radius:0;grid-template-columns:64px 1fr}.side{padding:12px 5px;align-items:center}.brand{font-size:0}.brand:after{content:'✉';font-size:20px}.nav{font-size:0;text-align:center;padding:12px 3px}.nav:before{content:attr(data-icon);font-size:18px}.nav .badge{font-size:10px;float:none;display:block}.account{font-size:10px;padding:10px 0}.chatlayout{grid-template-columns:112px 1fr}.threads{padding:6px}.thread{font-size:12px;padding:9px 5px}.top{padding:10px}.content{padding:15px}.msg{max-width:90%}}

</head><body>
<div class="shell" id="app" hidden><aside class="side"><div class="brand">ChatByKarnav</div><button class="nav active" data-view="chat" data-icon="💬">Community chat <span class="badge" id="global-badge"></span></button><button class="nav" data-view="people" data-icon="👥">Find people</button><button class="nav" data-view="profile" data-icon="👤">My profile</button><div class="account"><div id="myname">Signed in</div><small id="presence-label">● Online</small><p><button class="btn" id="theme">🌙</button> <button class="btn" id="signout">Sign out</button></p></div></aside>
<main class="main"><header class="top"><div><h2 id="title">Community chat</h2><small id="subtitle">Everyone in the community</small></div><div class="actions"><button class="btn" id="notify">Enable notifications</button></div></header>
<section class="area active" id="view-chat"><div class="chatlayout"><aside class="threads"><button class="thread selected" id="global-thread">🌐 Community chat</button><div class="subheading">PRIVATE MESSAGES</div><div id="thread-list"></div></aside><div class="main"><div class="messages" id="messages" aria-live="polite"></div><div class="compose"><div class="row"><input id="message-input" maxlength="2000" placeholder="Write a message…" aria-label="Write a message"><button class="btn primary" id="send">Send</button></div><div class="replybar hidden" id="replybar"><span id="replytext"></span><button class="btn" id="cancel-reply">Cancel reply</button></div><div class="hint" id="chat-status" aria-live="polite"></div><div class="row"><input id="message-search" placeholder="Search loaded messages" aria-label="Search messages"><button class="btn" id="older" hidden>Load older</button></div></div></div></div></section>
<section class="area" id="view-people"><div class="content"><h2>Find people</h2><p class="muted">Search member profiles. Block or report from a profile card, or start a private chat.</p><form id="search-form" class="row"><input class="search" id="search-input" maxlength="40" placeholder="Search by name"><button class="btn primary">Search</button></form><div class="hint" id="search-status"></div><div class="people" id="people-results"></div></div></section>
<section class="area" id="view-profile"><div class="content"><h2>Your profile</h2><form id="profile-form" class="card" style="max-width:620px"><label class="field">Display name<input id="display-name" maxlength="40" required></label><label class="field">Class / grade<input id="grade" maxlength="40"></label><label class="field">Division<input id="division" maxlength="40"></label><label class="field">School<input id="school" maxlength="100"></label><label class="field">Bio<textarea id="bio" maxlength="280" placeholder="A little about you…"></textarea></label><button class="btn primary">Save profile</button><span class="hint" id="profile-status"></span></form></div></section>
</main></div>
<div id="login" class="content" style="max-width:430px;margin:10vh auto"><h1>ChatByKarnav</h1><p>Sign in or create an account to join the community.</p><form id="auth-form"><label class="field">Name (required for signup)<input id="auth-name" maxlength="40"></label><label class="field">Email<input id="email" type="email" required autocomplete="email"></label><label class="field">Password<input id="password" type="password" minlength="6" required autocomplete="current-password"></label><div class="row"><button class="btn primary" id="login-button">Sign in</button><button class="btn" id="signup-button" type="button">Create account</button></div><p class="hint" id="auth-status"></p></form></div>
<script type="module">

const config={apiKey:'AIzaSyAZs-dZA-Y8ZLjlBIOqhs9wSVeZjZjW_jA',authDomain:'imessageclonekarnav.firebaseapp.com',projectId:'imessageclonekarnav',storageBucket:'imessageclonekarnav.firebasestorage.app',messagingSenderId:'136086923449',appId:'1:136086923449:web:b13eb6b0296f8e7e54d368'};
const app=initializeApp(config),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user=null,profile={},active='global',activePeer=null,stopMsgs=null,stopThreads=null,stopPresence=null,stopTyping=null,historyCursor=null,reply=null,unsub=[],lastGlobalIds=new Set(),lastNotify=0,sendLock=false;
const esc=s=>String(s||'');const fmt=t=>t?.toDate?new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(t.toDate()):'';function status(msg,error=false){$('chat-status').textContent=msg;$('chat-status').style.color=error?'#d04444':''}
function view(which){document.querySelectorAll('.area').forEach(x=>x.classList.toggle('active',x.id==='view-'+which));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===which));$('title').textContent=which==='chat'?(active==='global'?'Community chat':activePeer?.displayName||'Private chat'):which==='people'?'Find people':'Your profile';$('subtitle').textContent=which==='chat'?(active==='global'?'Everyone in the community':(activePeer?.online?'● Online':'Private conversation')):''}
function clearSubs(){for(const fn of unsub)fn();unsub=[];stopMsgs?.();stopMsgs=null;stopTyping?.();stopTyping=null}
function msgCollection(){return active==='global'?collection(db,'global_messages'):collection(db,'conversations',active,'messages')}
function notifyIncoming(data,id){if(data.uid===user.uid||!('Notification'in window)||Notification.permission!=='granted'||Date.now()-lastNotify<1000)return;lastNotify=Date.now();try{new Notification(data.sender||'New message',{body:data.text||'New message',tag:id})}catch{}}
function makeMsg(data,id){const el=document.createElement('article');el.className='msg'+(data.uid===user.uid?' mine':'');el.dataset.id=id;el.dataset.text=esc(data.text).toLowerCase();if(data.replyTo?.text){const q=document.createElement('div');q.className='replyquote';q.textContent='↪ '+data.replyTo.sender+': '+data.replyTo.text;el.append(q)}const by=document.createElement('div');by.className='by';by.textContent=data.uid===user.uid?'You':(data.sender||'Community member');el.append(by);const text=document.createElement('div');text.textContent=data.text||'';el.append(text);const time=document.createElement('div');time.className='when';time.textContent=fmt(data.timestamp);el.append(time);const tools=document.createElement('div');tools.className='msgtools';for(const emoji of ['👍','❤️','😂']){const b=document.createElement('button');b.type='button';b.textContent=emoji;b.title='React '+emoji;b.onclick=async()=>{try{const r=doc(msgCollection(),id,'reactions',user.uid),s=await getDoc(r);if(s.exists()&&s.data().emoji===emoji)await deleteDoc(r);else await setDoc(r,{uid:user.uid,emoji,createdAt:serverTimestamp()})}catch(e){status('Could not save reaction. Check Firestore rules.',true)}};tools.append(b)}const rb=document.createElement('button');rb.type='button';rb.textContent='↩ Reply';rb.onclick=()=>{reply={id,text:data.text||'',sender:data.sender||'Member'};$('replytext').textContent='Replying to '+reply.sender+': '+reply.text.slice(0,100);$('replybar').classList.remove('hidden');$('message-input').focus()};tools.append(rb);if(data.uid!==user.uid){const report=document.createElement('button');report.type='button';report.textContent='⚑ Report';report.onclick=()=>reportMessage(id,data.uid);tools.append(report)}el.append(tools);return el}
async function loadMessages(initial=true){if(!user)return;const box=$('messages');if(initial){box.replaceChildren();historyCursor=null}const q=initial?query(msgCollection(),orderBy('timestamp','desc'),limit(50)):query(msgCollection(),orderBy('timestamp','desc'),startAfter(historyCursor),limit(50));try{const s=await getDocs(q);if(!s.empty){historyCursor=s.docs[s.docs.length-1];const batch=s.docs.map(d=>({id:d.id,...d.data()})).reverse();const before=box.scrollHeight;batch.forEach(m=>{if(!initial&&box.querySelector(`[data-id="${CSS.escape(m.id)}"]`))return;box.append(makeMsg(m,m.id));if(initial&&active==='global'&&!lastGlobalIds.has(m.id))notifyIncoming(m,m.id)});$('older').hidden=s.size<50;if(initial)box.scrollTop=box.scrollHeight;else box.scrollTop=box.scrollHeight-before}else $('older').hidden=true}catch(e){console.error(e);status('Could not load messages. Check Firestore rules and indexes.',true)}}
function startChat(){clearSubs();loadMessages(true);const q=query(msgCollection(),orderBy('timestamp','desc'),limit(50));stopMsgs=onSnapshot(q,s=>{if(!s.metadata.hasPendingWrites){const incoming=s.docChanges().filter(c=>c.type==='added').map(c=>({id:c.doc.id,...c.doc.data()}));if(incoming.length){const nearBottom=$('messages').scrollHeight-$('messages').scrollTop-$('messages').clientHeight<140;incoming.reverse().forEach(m=>{if(!$('messages').querySelector(`[data-id="${CSS.escape(m.id)}"]`))$('messages').append(makeMsg(m,m.id));if(active==='global'&&!lastGlobalIds.has(m.id)){lastGlobalIds.add(m.id);if(lastGlobalIds.size>250)lastGlobalIds.delete(lastGlobalIds.values().next().value);if(m.uid!==user.uid)notifyIncoming(m,m.id)}});if(nearBottom)$('messages').scrollTop=$('messages').scrollHeight}}},e=>status('Live updates unavailable. Check Firestore rules.',true));
const typingCol=active==='global'?collection(db,'global_typing'):collection(db,'conversations',active,'typing');stopTyping=onSnapshot(typingCol,s=>{const others=s.docs.filter(d=>d.id!==user.uid&&d.data().typing);status(others.length?(others[0].data().name||'Someone')+' is typing…':'')},()=>{});
if(active!=='global'){setDoc(doc(db,'conversations',active,'readReceipts',user.uid),{readAt:serverTimestamp()},{merge:true}).catch(()=>{});}
}
function openGlobal(){active='global';activePeer=null;$('global-thread').classList.add('selected');document.querySelectorAll('.thread[data-id]').forEach(x=>x.classList.remove('selected'));view('chat');startChat()}
async function openPrivate(peer){try{const ids=[user.uid,peer.uid].sort(),id=ids.join('_'),r=doc(db,'conversations',id),s=await getDoc(r);if(!s.exists())await setDoc(r,{members:ids,createdAt:serverTimestamp(),lastMessage:'',updatedAt:serverTimestamp()});active=id;activePeer=peer;$('global-thread').classList.remove('selected');document.querySelectorAll('.thread[data-id]').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));view('chat');startChat()}catch(e){console.error(e);alert('Could not open private chat. The Firestore rules may need to be updated.') }}
function listenThreads(){stopThreads?.();stopThreads=onSnapshot(query(collection(db,'conversations'),where('members','array-contains',user.uid),orderBy('updatedAt','desc'),limit(30)),s=>{const box=$('thread-list');box.replaceChildren();s.forEach(d=>{const x=d.data(),peer=(x.members||[]).find(id=>id!==user.uid),b=document.createElement('button');b.className='thread'+(d.id===active?' selected':'');b.dataset.id=d.id;b.textContent='🔒 '+(x.memberNames?.[peer]||'Private chat')+' · '+(x.lastMessage||'Start chatting').slice(0,24);b.onclick=async()=>{const p=await getDoc(doc(db,'publicProfiles',peer));openPrivate({uid:peer,...(p.exists()?p.data():{displayName:'Member'})})};box.append(b)})},e=>console.warn('Thread list',e))}
async function sendMessage(){const input=$('message-input'),text=input.value.trim();if(!text||sendLock)return;if(Date.now()-(Number(localStorage.getItem('lastSendAt'))||0)<700){status('Please wait a moment before sending another message.');return}sendLock=true;$('send').disabled=true;try{const data={uid:user.uid,sender:profile.displayName,text:text.slice(0,2000),timestamp:serverTimestamp()};if(reply)data.replyTo={id:reply.id,text:reply.text.slice(0,300),sender:reply.sender};if(active==='global')await addDoc(collection(db,'global_messages'),data);else{await addDoc(collection(db,'conversations',active,'messages'),data);await setDoc(doc(db,'conversations',active),{lastMessage:text.slice(0,100),updatedAt:serverTimestamp(),memberNames:{[user.uid]:profile.displayName}}, {merge:true})}localStorage.setItem('lastSendAt',String(Date.now()));input.value='';reply=null;$('replybar').classList.add('hidden');status('')}catch(e){console.error(e);status('Message not sent. Check Firestore rules.',true)}finally{sendLock=false;$('send').disabled=false;input.focus()}}
let typingTimer;async function setTyping(value){if(!user)return;const c=active==='global'?collection(db,'global_typing'):collection(db,'conversations',active,'typing');const r=doc(c,user.uid);try{if(value)await setDoc(r,{typing:true,name:profile.displayName,updatedAt:serverTimestamp()});else await deleteDoc(r)}catch{}}
async function reportMessage(messageId,targetUid){const reason=prompt('Why are you reporting this message?');if(!reason)return;try{await addDoc(collection(db,'reports'),{reporterUid:user.uid,targetUid,messageId,scope:active==='global'?'global':'private',reason:reason.slice(0,500),createdAt:serverTimestamp(),status:'open'});status('Report submitted. Thank you.')}catch(e){status('Could not submit report. Check Firestore rules.',true)}}

onAuthStateChanged(auth,async u=>{user=u;if(!u){$('login').classList.remove('hidden');$('app').hidden=true;clearSubs();stopThreads?.();return}try{const p=doc(db,'publicProfiles',u.uid),s=await getDoc(p);profile=s.exists()?s.data():{displayName:u.displayName||'Community member',grade:'',division:'',school:'',bio:''};profile.displayName=profile.displayName||u.displayName||'Community member';if(!s.exists())await setDoc(p,{displayName:profile.displayName,displayNameLower:profile.displayName.toLocaleLowerCase(),grade:'',division:'',school:'',bio:'',updatedAt:serverTimestamp()});$('display-name').value=profile.displayName;$('grade').value=profile.grade||'';$('division').value=profile.division||'';$('school').value=profile.school||'';$('bio').value=profile.bio||'';$('myname').textContent=profile.displayName;$('login').classList.add('hidden');$('app').hidden=false;listenThreads();openGlobal();const presence=doc(db,'users',u.uid,'presence','current');const beat=()=>setDoc(presence,{online:true,lastSeen:serverTimestamp()},{merge:true}).catch(()=>{});beat();const heartbeat=setInterval(beat,60000);unsub.push(()=>clearInterval(heartbeat));window.addEventListener('beforeunload',()=>setDoc(presence,{online:false,lastSeen:serverTimestamp()},{merge:true}));}catch(e){console.error(e);$('auth-status').textContent='Could not load profile. Check Firestore rules.'}});
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>view(b.dataset.view));$('global-thread').onclick=openGlobal;$('send').onclick=sendMessage;$('message-input').addEventListener('keydown',()=>{setTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>setTyping(false),1600)});$('message-input').addEventListener('blur',()=>setTyping(false));$('cancel-reply').onclick=()=>{reply=null;$('replybar').classList.add('hidden')};$('older').onclick=()=>loadMessages(false);$('message-search').oninput=e=>{const term=e.target.value.toLocaleLowerCase();document.querySelectorAll('.msg').forEach(m=>m.hidden=!m.dataset.text.includes(term))};$('theme').onclick=()=>document.body.classList.toggle('dark');$('signout').onclick=()=>signOut(auth);$('notify').onclick=async()=>{if(!('Notification'in window)){status('Notifications are not supported in this browser.');return}const p=await Notification.requestPermission();$('notify').textContent=p==='granted'?'Notifications enabled':'Notifications blocked'};
$('search-form').onsubmit=async e=>{e.preventDefault();const term=$('search-input').value.trim().toLocaleLowerCase(),box=$('people-results');box.replaceChildren();$('search-status').textContent='Searching…';if(term.length<2){$('search-status').textContent='Type at least two characters.';return}try{const s=await getDocs(query(collection(db,'publicProfiles'),orderBy('displayNameLower'),limit(100)));let count=0;for(const d of s.docs){if(d.id===user.uid)continue;const p=d.data(),name=p.displayName||'Member';if(!name.toLocaleLowerCase().includes(term))continue;const blocked=await getDoc(doc(db,'users',user.uid,'blocks',d.id));if(blocked.exists())continue;const card=document.createElement('article');card.className='card';const h=document.createElement('div');h.className='personhead';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=name.slice(0,1).toUpperCase();const meta=document.createElement('div'),title=document.createElement('h3');title.textContent=name;meta.append(title);const detail=document.createElement('div');detail.className='muted';detail.textContent=[p.grade&&'Class '+p.grade,p.division&&'Division '+p.division,p.school,p.bio].filter(Boolean).join(' · ')||'Community member';meta.append(detail);h.append(avatar,meta);card.append(h);const message=document.createElement('button');message.className='btn primary';message.textContent='Message';message.onclick=()=>openPrivate({uid:d.id,...p});const block=document.createElement('button');block.className='btn';block.textContent='Block';block.onclick=()=>blockUser(d.id,name);const report=document.createElement('button');report.className='btn';report.textContent='Report profile';report.onclick=async()=>{const reason=prompt('Why are you reporting this profile?');if(!reason)return;try{await addDoc(collection(db,'reports'),{reporterUid:user.uid,targetUid:d.id,scope:'profile',reason:reason.slice(0,500),createdAt:serverTimestamp(),status:'open'});alert('Report submitted.')}catch{alert('Could not submit report.')}};card.append(message,block,report);box.append(card);count++}$('search-status').textContent=count?`${count} profile${count===1?'':'s'} found.`:'No matching profiles.'}catch(err){console.error(err);$('search-status').textContent='Search failed. Check Firestore rules and indexes.'}};
