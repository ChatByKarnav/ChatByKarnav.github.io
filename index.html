<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5f7">
    <meta name="description" content="ChatByKarnav — a simple, live chat with an iMessage-inspired design.">
    <title>ChatByKarnav</title>
    <style>
        :root {
            color-scheme: light;
            --blue: #087eff;
            --green: #31c759;
            --gray-bubble: #e9e9eb;
            --border: #e5e5ea;
            --sidebar: #f5f5f7;
            --surface: #fff;
            --text: #171719;
            --muted: #8e8e93;
            --composer: #fff;
            --shadow: 0 24px 70px rgba(0, 0, 0, .18);
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --gray-bubble: #303034;
            --border: #38383a;
            --sidebar: #1c1c1e;
            --surface: #111113;
            --text: #f5f5f7;
            --muted: #a1a1a6;
            --composer: #1c1c1e;
            --shadow: 0 24px 70px rgba(0, 0, 0, .4);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-width: 320px;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at top, #dceaff 0%, #f5f5f7 55%, #e8e8ed 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }
        [data-theme="dark"] body { background: #08080a; }
        button, input { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }

        .app {
            width: min(1120px, 94vw);
            height: min(780px, 90vh);
            height: min(780px, 90dvh);
            min-height: 420px;
            display: flex;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid rgba(120, 120, 128, .18);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        .sidebar {
            width: 290px;
            flex: 0 0 290px;
            padding: 28px 18px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 11px; margin: 0 0 34px 5px; }
        .brand-icon {
            width: 38px; height: 38px; display: grid; place-items: center;
            border-radius: 12px; color: #fff; font-size: 19px; font-weight: 700;
            background: linear-gradient(145deg, #40a3ff, #087eff);
            box-shadow: 0 5px 13px rgba(8, 126, 255, .25);
        }
        .brand-name { margin: 0; font-size: 19px; letter-spacing: -.5px; font-weight: 700; }
        .section-label {
            margin: 0 8px 10px; color: var(--muted); font-size: 11px;
            font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
        }
        .room {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            border-radius: 12px; background: rgba(8, 126, 255, .1);
        }
        .room-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--blue); color: white; font-size: 19px; }
        .room-name { font-size: 14px; font-weight: 650; }
        .room-status { display: flex; align-items: center; gap: 5px; margin-top: 4px; color: var(--muted); font-size: 12px; }
        .online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
        .sidebar-note { margin: 20px 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }

        .chat { min-width: 0; flex: 1; display: flex; flex-direction: column; background: var(--surface); }
        .chat-header {
            min-height: 76px; padding: 14px 22px; display: flex; align-items: center;
            justify-content: space-between; border-bottom: 1px solid var(--border);
        }
        .header-person { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: linear-gradient(145deg, #a4d5ff, #6bb5ff); color: #fff; font-size: 20px; }
        .header-title { margin: 0; font-size: 15px; font-weight: 650; }
        .header-subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
        .theme-button {
            width: 38px; height: 38px; display: grid; place-items: center; border: 0;
            border-radius: 50%; color: var(--muted); background: transparent; cursor: pointer; font-size: 18px;
        }
        .theme-button:hover { background: var(--gray-bubble); }
        .chat-history {
            flex: 1; overflow-y: auto; padding: 24px clamp(16px, 5vw, 58px);
            display: flex; flex-direction: column; gap: 9px; scroll-behavior: smooth;
        }
        .empty-state { margin: auto; max-width: 260px; color: var(--muted); text-align: center; line-height: 1.5; font-size: 14px; }
        .empty-icon { display: block; margin-bottom: 10px; font-size: 34px; }
        .message-row { width: 100%; display: flex; align-items: flex-end; gap: 7px; }
        .message-row.sent { justify-content: flex-end; }
        .message-row.received { justify-content: flex-start; }
        .bubble {
            max-width: min(72%, 520px); padding: 10px 15px; border-radius: 20px;
            font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap;
        }
        .sent .bubble { color: #fff; background: var(--blue); border-bottom-right-radius: 5px; }
        .received .bubble { color: var(--text); background: var(--gray-bubble); border-bottom-left-radius: 5px; }
        .sender { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 650; opacity: .72; }
        .message-time { margin: 0 7px 3px; color: var(--muted); font-size: 10px; white-space: nowrap; }
        .system-message { align-self: center; margin: 7px 0; color: var(--muted); text-align: center; font-size: 12px; }
        .input-area { padding: 14px 22px 18px; border-top: 1px solid var(--border); background: var(--surface); }
        .input-row { display: flex; align-items: center; gap: 10px; max-width: 760px; margin: 0 auto; }
        .message-input {
            flex: 1; min-width: 0; height: 46px; padding: 0 17px; border: 1px solid var(--border);
            border-radius: 24px; outline: none; background: var(--composer); color: var(--text); font-size: 15px;
        }
        .message-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8, 126, 255, .12); }
        .send-button {
            width: 42px; height: 42px; flex: 0 0 42px; display: grid; place-items: center;
            border: 0; border-radius: 50%; background: var(--blue); color: #fff;
            font-size: 20px; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .15s;
        }
        .send-button:hover:not(:disabled) { transform: scale(1.05); }
        .send-button:disabled { opacity: .45; cursor: not-allowed; }
        .notice { min-height: 16px; margin: 7px 8px 0; color: var(--muted); font-size: 11px; }
        .notice.error { color: #d93025; }

        .setup-screen {
            position: fixed; inset: 0; z-index: 5; display: grid; place-items: center;
            padding: 20px; background: rgba(20, 24, 32, .42); backdrop-filter: blur(12px);
        }
        .setup-card {
            width: min(390px, 100%); padding: 34px; border: 1px solid rgba(120, 120, 128, .18);
            border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); text-align: center;
        }
        .setup-card .brand-icon { width: 54px; height: 54px; margin: 0 auto 17px; font-size: 25px; }
        .setup-card h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.4px; }
        .setup-card p { margin: 0 0 22px; color: var(--muted); font-size: 14px; line-height: 1.5; }
        .setup-input { width: 100%; height: 46px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; outline: none; background: var(--composer); color: var(--text); text-align: center; font-size: 15px; }
        .setup-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(8, 126, 255, .12); }
        .join-button { width: 100%; height: 46px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--blue); color: #fff; font-weight: 650; cursor: pointer; }
        .setup-error { min-height: 17px; margin-top: 9px; color: #d93025; font-size: 12px; }
        [hidden] { display: none !important; }

        @media (max-width: 640px) {
            body { display: block; background: var(--surface); }
            .app { width: 100%; height: 100%; height: 100dvh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
            .sidebar { display: none; }
            .chat-header { min-height: 66px; padding: 10px 16px; }
            .chat-history { padding: 20px 14px; }
            .bubble { max-width: 82%; }
            .input-area { padding: 10px 14px max(12px, env(safe-area-inset-bottom)); }
            .setup-card { padding: 28px 23px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <div class="setup-screen" id="setup-screen" role="dialog" aria-modal="true" aria-labelledby="setup-title">
        <form class="setup-card" id="setup-form">
            <div class="brand-icon" aria-hidden="true">✉</div>
            <h2 id="setup-title">Welcome to ChatByKarnav</h2>
            <p>Choose a name to join the live chat.</p>
            <label class="section-label" for="username-input">Your name</label>
            <input class="setup-input" id="username-input" type="text" placeholder="e.g. Alex" maxlength="40" autocomplete="nickname" required>
            <button class="join-button" type="submit">Join Chat</button>
            <div class="setup-error" id="setup-error" role="alert"></div>
        </form>
    </div>

    <div class="app">
        <aside class="sidebar" aria-label="Chats">
            <div class="brand"><div class="brand-icon" aria-hidden="true">✉</div><h1 class="brand-name">ChatByKarnav</h1></div>
            <p class="section-label">Messages</p>
            <div class="room">
                <div class="room-icon" aria-hidden="true">✦</div>
                <div><div class="room-name">Community Chat</div><div class="room-status"><span class="online-dot"></span><span id="connection-status">Connecting…</span></div></div>
            </div>
            <p class="sidebar-note">A friendly public room. Please be kind and avoid sharing personal information.</p>
        </aside>

        <main class="chat">
            <header class="chat-header">
                <div class="header-person">
                    <div class="avatar" aria-hidden="true">✦</div>
                    <div><h2 class="header-title">Community Chat</h2><div class="header-subtitle" id="header-status">Live conversation</div></div>
                </div>
                <button class="theme-button" id="theme-button" type="button" aria-label="Switch to dark mode" title="Toggle appearance">☾</button>
            </header>
            <section class="chat-history" id="chat-stream" aria-label="Messages" aria-live="polite" aria-relevant="additions">
                <div class="empty-state" id="empty-state"><span class="empty-icon" aria-hidden="true">💬</span>Say hello and start the conversation.</div>
            </section>
            <footer class="input-area">
                <form class="input-row" id="message-form">
                    <input class="message-input" id="msg-input" type="text" placeholder="iMessage" maxlength="2000" autocomplete="off" aria-label="Write a message" disabled>
                    <button class="send-button" id="send-btn" type="submit" aria-label="Send message" disabled>↑</button>
                </form>
                <div class="notice" id="notice" role="status"></div>
            </footer>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            addDoc,
            collection,
            getFirestore,
            limit,
            onSnapshot,
            orderBy,
            query,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZs-dZA-Y8ZLjlBIOqhs9wSVeZjZjW_jA",
            authDomain: "imessageclonekarnav.firebaseapp.com",
            projectId: "imessageclonekarnav",
            storageBucket: "imessageclonekarnav.firebasestorage.app",
            messagingSenderId: "136086923449",
            appId: "1:136086923449:web:b13eb6b0296f8e7e54d368",
            measurementId: "G-F3KWN905WE"
        };

        const elements = {
            setup: document.getElementById("setup-screen"),
            setupForm: document.getElementById("setup-form"),
            name: document.getElementById("username-input"),
            setupError: document.getElementById("setup-error"),
            messageForm: document.getElementById("message-form"),
            message: document.getElementById("msg-input"),
            send: document.getElementById("send-btn"),
            stream: document.getElementById("chat-stream"),
            empty: document.getElementById("empty-state"),
            notice: document.getElementById("notice"),
            status: document.getElementById("connection-status"),
            headerStatus: document.getElementById("header-status"),
            theme: document.getElementById("theme-button")
        };

        let currentUser = "";
        let db;
        let unsubscribeMessages;

        function showNotice(message, isError = false) {
            elements.notice.textContent = message;
            elements.notice.classList.toggle("error", isError);
        }

        function describeError(error) {
            if (error?.code === "permission-denied") {
                return "Chat access is blocked. Check the Firestore security rules for global_messages.";
            }
            if (error?.code === "unavailable") {
                return "Chat is temporarily unavailable. Check your connection and try again.";
            }
            return "Could not connect to chat. Please try again later.";
        }

        function renderMessage(data) {
            const row = document.createElement("div");
            const sent = data.sender === currentUser;
            row.className = `message-row ${sent ? "sent" : "received"}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            if (!sent) {
                const sender = document.createElement("span");
                sender.className = "sender";
                sender.textContent = typeof data.sender === "string" ? data.sender : "Guest";
                bubble.appendChild(sender);
            }
            const text = document.createElement("span");
            text.textContent = typeof data.text === "string" ? data.text : "";
            bubble.appendChild(text);
            row.appendChild(bubble);

            const date = data.timestamp?.toDate?.();
            if (date) {
                const time = document.createElement("time");
                time.className = "message-time";
                time.dateTime = date.toISOString();
                time.textContent = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(date);
                row.appendChild(time);
            }
            elements.stream.appendChild(row);
        }

        function listenForMessages() {
            const messagesQuery = query(
                collection(db, "global_messages"),
                orderBy("timestamp", "asc"),
                limit(200)
            );
            unsubscribeMessages = onSnapshot(messagesQuery, (snapshot) => {
                elements.stream.replaceChildren();
                elements.empty.hidden = !snapshot.empty;
                snapshot.forEach((messageDoc) => renderMessage(messageDoc.data()));
                elements.stream.scrollTop = elements.stream.scrollHeight;
                elements.status.textContent = "Connected";
                elements.headerStatus.textContent = "Live conversation";
                showNotice("");
                elements.message.disabled = false;
                elements.send.disabled = false;
            }, (error) => {
                console.error("Chat listener error:", error);
                elements.status.textContent = "Connection issue";
                elements.headerStatus.textContent = "Unable to load messages";
                showNotice(describeError(error), true);
            });
        }

        elements.setupForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const name = elements.name.value.trim();
            if (!name) {
                elements.setupError.textContent = "Please enter a name to continue.";
                elements.name.focus();
                return;
            }
            currentUser = name.slice(0, 40);
            elements.setup.hidden = true;
            elements.message.focus();
            listenForMessages();
        });

        elements.messageForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const text = elements.message.value.trim();
            if (!text || !currentUser || !db || elements.send.disabled) return;

            elements.send.disabled = true;
            showNotice("");
            try {
                await addDoc(collection(db, "global_messages"), {
                    sender: currentUser,
                    text: text.slice(0, 2000),
                    timestamp: serverTimestamp()
                });
                elements.message.value = "";
            } catch (error) {
                console.error("Message send error:", error);
                showNotice(describeError(error), true);
            } finally {
                elements.send.disabled = false;
                elements.message.focus();
            }
        });

        elements.theme.addEventListener("click", () => {
            const isDark = document.documentElement.dataset.theme !== "dark";
            if (isDark) document.documentElement.dataset.theme = "dark";
            else delete document.documentElement.dataset.theme;
            elements.theme.textContent = isDark ? "☀" : "☾";
            elements.theme.setAttribute("aria-label", isDark ? "Switch to light mode" : "Switch to dark mode");
        });

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase initialization error:", error);
            elements.status.textContent = "Offline";
            elements.headerStatus.textContent = "Chat could not initialize";
            showNotice(describeError(error), true);
            elements.setupError.textContent = "Chat is temporarily unavailable. Please try again later.";
        }

        window.addEventListener("beforeunload", () => unsubscribeMessages?.());
    </script>
</body>
</html>
